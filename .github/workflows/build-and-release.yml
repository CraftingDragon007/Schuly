name: Build and Release Flutter Apps

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Gradle plugin repositories
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp android/gradle/plugin-repositories.init.gradle \
            "$HOME/.gradle/init.d/flutter-plugin-repositories.gradle"

      - name: Setup release keystore
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?KEYSTORE_BASE64 secret is required for a signed release}"
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required for a signed release}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required for a signed release}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app-release.jks
          fingerprint="$(keytool -exportcert -alias release -keystore app-release.jks -storepass "$KEYSTORE_PASSWORD" | sha256sum | awk '{print toupper($1)}')"
          expected_fingerprint="368F4D24D9AA0D8FDB243468CB8FE3A4D79681448C5397AFBDCEC2683D15E7C0"
          if [ "$fingerprint" != "$expected_fingerprint" ]; then
            echo "Release keystore certificate does not match the published v2.7.1 signing certificate."
            exit 1
          fi

      - name: Create key.properties
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Creating key.properties file..."
          cat > key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=release
          storeFile=../app-release.jks
          EOF

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate app icons
        working-directory: .
        run: dart run flutter_launcher_icons

      - name: Resolve numeric app version
        id: app_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to resolve a numeric app version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        working-directory: .
        env:
          SENTRY_DSN: ${{ vars.SENTRY_URL }}
        run: |
          flutter build apk --release --flavor prod \
            --build-name="${{ steps.app_version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="https://schuly.gamepowerx.com" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="${{ github.ref_name }}" \
            --dart-define=SENTRY_ENVIRONMENT="production" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Build Android AAB (App Bundle)
        working-directory: .
        env:
          SENTRY_DSN: ${{ vars.SENTRY_URL }}
        run: |
          flutter build appbundle --release --flavor prod \
            --build-name="${{ steps.app_version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="https://schuly.gamepowerx.com" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="${{ github.ref_name }}" \
            --dart-define=SENTRY_ENVIRONMENT="production" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Verify Android APK signing certificate
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo "Android SDK build-tools directory was not found."
            exit 1
          fi
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -perm -u+x | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "apksigner was not found under $sdk_root/build-tools."
            exit 1
          fi
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-prod-release.apk > apk-signature.txt
          fingerprint="$(awk -F': ' '/certificate SHA-256 digest/{gsub(/:/, "", $2); print toupper($2)}' apk-signature.txt)"
          expected_fingerprint="368F4D24D9AA0D8FDB243468CB8FE3A4D79681448C5397AFBDCEC2683D15E7C0"
          if [ "$fingerprint" != "$expected_fingerprint" ]; then
            echo "Observed APK certificate SHA-256: ${fingerprint:-<unparsed>}"
            echo "Expected APK certificate SHA-256: $expected_fingerprint"
            echo "Built APK is not signed with the published v2.7.1 certificate."
            exit 1
          fi

      - name: Upload Android APK for signing diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-signing-diagnosis
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Prepare artifacts
        working-directory: .
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk artifacts/schuly-${{ github.ref_name }}.apk
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab artifacts/schuly-${{ github.ref_name }}.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: ./artifacts/

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: .
        run: flutter pub get

      - name: Generate app icons
        working-directory: .
        run: dart run flutter_launcher_icons

      - name: Resolve numeric app version
        id: app_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
          else
            version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?$/\1/p' pubspec.yaml)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to resolve a numeric app version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build iOS (unsigned)
        working-directory: .
        env:
          SENTRY_DSN: ${{ vars.SENTRY_URL }}
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ steps.app_version.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=BACKEND_BASE_URL="https://schuly.gamepowerx.com" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=SENTRY_RELEASE="${{ github.ref_name }}" \
            --dart-define=SENTRY_ENVIRONMENT="production" \
            --dart-define=FIREBASE_API_KEY="${{ vars.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ vars.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ vars.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ vars.FIREBASE_PROJECT_ID }}"

      - name: Create iOS Archive
        working-directory: .
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination generic/platform=iOS -archivePath build/Runner.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Export iOS IPA
        working-directory: .
        run: |
          cd ios
          mkdir -p artifacts
          mkdir -p build/ipa
          cp -r build/Runner.xcarchive/Products/Applications/Runner.app build/ipa/
          cd build/ipa
          zip -r ../../artifacts/schuly-${{ github.ref_name }}.ipa Runner.app

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ./ios/artifacts/

  upload-to-release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Upload Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-build/schuly-${{ github.ref_name }}.apk
            android-build/schuly-${{ github.ref_name }}.aab
            ios-build/schuly-${{ github.ref_name }}.ipa
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
